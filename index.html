<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Catalogo Retro Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>RETRO-TECH CATALOG // SYSTEM v1.0</h1>
        <p>Seleccione una categoria para filtrar los componentes disponibles.</p>
        <nav>
            <button class="nav-btn active" data-category="all">[ TODOS ]</button>
            <button class="nav-btn" data-category="workstation">[ WORKSTATIONS ]</button>
            <button class="nav-btn" data-category="desktop">[ DESKTOPS ]</button>
            <button class="nav-btn" data-category="laptop">[ LAPTOPS ]</button>
            <button class="nav-btn" data-category="mobile">[ CELULARES ]</button>
        </nav>
    </header>

    <main class="catalog-grid" id="catalog-grid">
        <!-- Los elementos se cargan mediante JavaScript -->
    </main>

    <footer>
        <p>SISTEMA OPERATIVO RETRO-TECH V1.0 // ALMACENADO EN GITHUB</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
